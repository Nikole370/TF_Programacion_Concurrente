version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    networks:
      my_network:
        ipv4_address: 172.20.0.10

  nodo1:
    build:
      context: .
      dockerfile: Nodos/Node1/Dockerfile
    ports:
      - "19002:9002"
    depends_on:
      - redis
    networks:
      my_network:
        ipv4_address: 172.20.0.2

  nodo2:
    build:
      context: .
      dockerfile: Nodos/Node2/Dockerfile
    ports:
      - "29002:9002"
    depends_on:
      - redis
    networks:
      my_network:
        ipv4_address: 172.20.0.3

  nodo3:
    build:
      context: .
      dockerfile: Nodos/Node3/Dockerfile
    ports:
      - "39002:9002"
    depends_on:
      - redis
    networks:
      my_network:
        ipv4_address: 172.20.0.4

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/24"
